        <button class="queue-filter px-2 py-1 rounded border border-rose-900 text-rose-400 hover:text-rose-200" data-pri="high">High</button>
        <button class="queue-filter px-2 py-1 rounded border border-amber-900 text-amber-400 hover:text-amber-200" data-pri="medium">Medium</button>
      </div>
    </div>
    <div id="queue-list" class="space-y-2 max-h-[600px] overflow-y-auto scrollbar-thin pr-2"></div>
  </div>
  <div class="panel rounded-lg p-5">
    <h2 class="text-lg font-bold text-slate-100 mb-4">Authors</h2>
    <div id="author-list" class="space-y-1.5 text-sm max-h-[600px] overflow-y-auto scrollbar-thin"></div>
  </div>
</section>

<section class="panel rounded-lg p-5">
  <h2 class="text-lg font-bold text-slate-100 mb-4">Additions Timeline</h2>
  <div style="position: relative; height: 220px;">
    <canvas id="timeline-chart"></canvas>
  </div>
</section>

<section>
  <h2 class="text-lg font-bold text-slate-100 mb-4">All Papers &amp; Blogs</h2>
  <div id="paper-list" class="space-y-3"></div>
</section>

</main>

<footer class="border-t border-slate-800 mt-12 py-6 text-center text-xs text-slate-500">
  Generated <span id="gen-time"></span> · Self-contained · All data inline · No runtime fetches
</footer>

<script>
const data = JSON.parse(document.getElementById('vault-data').textContent);
const escapeHtml = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const truncate = (s, n) => { s = String(s||''); return s.length > n ? s.slice(0, n).trim() + '…' : s; };

// ── Meta + gen time
document.getElementById('gen-time').textContent = data.generated_at;
document.getElementById('meta').innerHTML = `<div>Vault scope: <span class="text-slate-300 font-semibold">${data.scope.name}</span></div><div>${data.generated_at.slice(0,10)}</div>`;

// ── Stats
const statDefs = [
  { key: 'papers', label: 'Papers', color: 'text-indigo-300' },
  { key: 'blogs', label: 'Blogs', color: 'text-sky-300' },
  { key: 'threads', label: 'Threads', color: 'text-purple-300' },
  { key: 'topics', label: 'Topics', color: 'text-emerald-300' },
  { key: 'authors_indexed', label: 'Indexed authors', color: 'text-amber-300' },
  { key: 'queued', label: 'Queued', color: 'text-rose-300' },
  { key: 'deep_read', label: 'Deep-read', color: 'text-teal-300' },
];
document.getElementById('stats-section').innerHTML = statDefs.map(s => `
  <div class="panel rounded-lg p-4">
    <div class="text-3xl font-bold ${s.color}">${data.stats[s.key]}</div>
    <div class="text-xs uppercase tracking-wider text-slate-500 mt-1">${s.label}</div>
  </div>
`).join('');

// ── Topic grid
const papersBySlug = Object.fromEntries(data.papers.map(p => [p.slug, p]));
const blogsBySlug = Object.fromEntries(data.blogs.map(b => [b.slug, b]));
const topicGridEl = document.getElementById('topic-grid');
document.getElementById('topics-count').textContent = `${data.topics.length} MOCs · ${data.papers.length + data.blogs.length} linked items`;

function renderTopics(filterFn = () => true) {
  topicGridEl.innerHTML = data.topics.filter(filterFn).map(t => {
    const items = [...t.paper_slugs.map(s => papersBySlug[s]).filter(Boolean), ...t.blog_slugs.map(s => blogsBySlug[s]).filter(Boolean)];
    const topItems = items.slice(0, 3).map(p => `<li class="truncate text-slate-400 text-xs">• ${escapeHtml(p.title)}</li>`).join('');
    const related = t.related_topics.map(r => `<span class="badge badge-topic">${escapeHtml(r)}</span>`).join(' ');
    return `<div class="panel panel-hover rounded-lg p-4 cursor-pointer" data-topic="${t.slug}">
      <div class="flex items-baseline justify-between mb-2">
        <h3 class="font-semibold text-slate-100">${escapeHtml(t.title)}</h3>
        <span class="text-xs text-slate-500">${items.length} item${items.length === 1 ? '' : 's'}</span>
      </div>
      <p class="text-xs text-slate-400 mb-3 line-clamp-3">${escapeHtml(truncate(t.description, 220))}</p>
      <ul class="space-y-0.5 mb-3">${topItems}</ul>
      ${related ? `<div class="flex flex-wrap gap-1 pt-2 border-t border-slate-800">${related}</div>` : ''}
    </div>`;
  }).join('');
  // Click handler to scroll-filter paper list
  topicGridEl.querySelectorAll('[data-topic]').forEach(el => {
    el.addEventListener('click', () => {
      const topic = el.dataset.topic;
      document.getElementById('search').value = '';
      const matching = data.papers.filter(p => (p.topics || []).includes(topic));
      const blogMatching = data.blogs.filter(b => (b.topics || []).includes(topic));
      renderPapers([...matching, ...blogMatching]);
      document.getElementById('paper-list').scrollIntoView({ behavior: 'smooth' });
    });
  });
}
renderTopics();

// ── Reading queue
let queueFilter = 'all';
function renderQueue() {
  const items = data.reading_queue.filter(it => queueFilter === 'all' || (it.priority || 'medium') === queueFilter);
  document.getElementById('queue-list').innerHTML = items.length === 0
    ? `<div class="text-sm text-slate-500 italic py-8 text-center">No items in queue under this filter.</div>`
    : items.map(p => {
        const isBlog = blogsBySlug[p.slug];
        const author = isBlog ? p.author : (p.authors || []).slice(0, 2).join(', ') + ((p.authors || []).length > 2 ? ' et al.' : '');
        return `<div class="paper-border-${p.priority || 'medium'} bg-slate-900 rounded p-3 hover:bg-slate-800">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="badge badge-${p.priority || 'medium'}">${p.priority || 'medium'}</span>
                <span class="badge badge-${p.read_state || 'queued'}">${p.read_state || 'queued'}</span>
                ${isBlog ? '<span class="badge badge-topic">blog</span>' : '<span class="badge badge-topic">paper</span>'}
                <span class="text-xs text-slate-500">added ${escapeHtml(p.added || '')}</span>
              </div>
              <div class="font-semibold text-slate-100 mt-1 text-sm">${escapeHtml(p.title)}</div>
              <div class="text-xs text-slate-400 mt-0.5">${escapeHtml(author)}${p.year ? ' · ' + p.year : ''}${p.venue ? ' · ' + escapeHtml(p.venue) : ''}</div>
              <div class="text-xs text-slate-300 mt-2 leading-relaxed">${escapeHtml(truncate(p.tldr, 280))}</div>
              <div class="text-[10px] text-slate-600 mt-2 font-mono">rw_id: ${escapeHtml(p.rw_id || '—')}</div>
            </div>
          </div>
        </div>`;
      }).join('');
}
renderQueue();
document.querySelectorAll('.queue-filter').forEach(b => b.addEventListener('click', () => {
  queueFilter = b.dataset.pri;
  document.querySelectorAll('.queue-filter').forEach(x => x.classList.toggle('bg-slate-800', x.dataset.pri === queueFilter));
  renderQueue();
}));

// ── Authors leaderboard (by total appearances, not just first-author)
document.getElementById('author-list').innerHTML = data.top_authors.map(([name, count]) => `
  <div class="flex items-center justify-between gap-3 py-1 px-2 rounded hover:bg-slate-800 cursor-pointer" data-author="${escapeHtml(name)}">
    <span class="text-slate-200 truncate">${escapeHtml(name)}</span>
    <span class="text-xs text-slate-500 font-mono shrink-0">${count}</span>
  </div>
`).join('');
document.querySelectorAll('[data-author]').forEach(el => {
  el.addEventListener('click', () => {
    const name = el.dataset.author;
    const matching = data.papers.filter(p => (p.authors || []).includes(name));
    renderPapers(matching);
    document.getElementById('paper-list').scrollIntoView({ behavior: 'smooth' });
  });
});

// ── Timeline chart
const dates = Object.keys(data.timeline).sort();
const counts = dates.map(d => data.timeline[d]);
new Chart(document.getElementById('timeline-chart'), {
  type: 'bar',
  data: {
    labels: dates,
    datasets: [{
      label: 'Items added',
      data: counts,
      backgroundColor: 'rgba(99, 102, 241, 0.6)',
      borderColor: 'rgba(99, 102, 241, 1)',
      borderWidth: 1,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
      y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', precision: 0 }, beginAtZero: true },
    },
  },
});

// ── Paper / blog list
function renderPapers(items) {
  if (items === undefined) items = [...data.papers, ...data.blogs];
  // Sort by added desc
  items = items.slice().sort((a, b) => (b.added || '').localeCompare(a.added || ''));
  document.getElementById('paper-list').innerHTML = items.length === 0
    ? `<div class="text-sm text-slate-500 italic py-8 text-center">No matches.</div>`
    : items.map(p => {
        const isBlog = blogsBySlug[p.slug];
        const author = isBlog ? p.author : (p.authors || []).join(', ');
        const topicBadges = (p.topics || []).map(t => `<span class="badge badge-topic">${escapeHtml(t)}</span>`).join(' ');
        const claims = (p.key_claims || []).slice(0, 3).map(c => `<li class="text-xs text-slate-300 leading-relaxed pl-2">• ${escapeHtml(c)}</li>`).join('');
        return `<details class="paper-border-${p.priority || 'medium'} bg-slate-900 rounded p-4 panel-hover">
          <summary class="flex items-start gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="badge badge-${p.priority || 'medium'}">${p.priority || 'medium'}</span>
                <span class="badge badge-${p.read_state || 'queued'}">${p.read_state || 'queued'}</span>
                <span class="badge badge-topic">${isBlog ? 'blog' : 'paper'}</span>
                ${p.year ? `<span class="text-xs text-slate-500">${p.year}</span>` : ''}
              </div>
              <div class="font-semibold text-slate-100 mt-1.5">${escapeHtml(p.title)}</div>
              <div class="text-xs text-slate-400 mt-1">${escapeHtml(author)}${p.venue ? ' · ' + escapeHtml(p.venue) : ''}</div>
              <div class="text-sm text-slate-200 mt-2.5 leading-relaxed">${escapeHtml(p.tldr)}</div>
              <div class="flex flex-wrap gap-1 mt-3">${topicBadges}</div>
            </div>
            <span class="chevron text-slate-500">▾</span>
          </summary>
          <div class="mt-4 pt-4 border-t border-slate-800 space-y-3">
            ${claims ? `<div><div class="text-xs uppercase tracking-wider text-slate-500 mb-2">Key claims <span class="analyst-tag">verbatim from note</span></div><ul class="space-y-1.5">${claims}</ul></div>` : ''}
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div>
                <div class="text-slate-500 uppercase tracking-wider mb-1">rw_id</div>
                <div class="font-mono text-slate-300 break-all">${escapeHtml(p.rw_id || '—')}</div>
              </div>
              <div>
                <div class="text-slate-500 uppercase tracking-wider mb-1">Source URL</div>
                <a href="${escapeHtml(p.url || '#')}" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300 break-all">${escapeHtml(p.url || '—')}</a>
              </div>
            </div>
            <div class="text-xs text-slate-500">Slug: <span class="font-mono text-slate-400">${escapeHtml(p.slug)}</span> · Added: ${escapeHtml(p.added || '—')} · Body: ${p.word_count || 0} words</div>
          </div>
        </details>`;
      }).join('');
}
renderPapers();

// ── Search
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { renderTopics(); renderPapers(); return; }
  // Filter topics
  renderTopics(t => t.slug.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q));
  // Filter papers + blogs
  const matchAll = [...data.papers, ...data.blogs].filter(p =>
    (p.title || '').toLowerCase().includes(q)
    || (p.tldr || '').toLowerCase().includes(q)
    || (p.slug || '').toLowerCase().includes(q)
    || (p.authors || []).some(a => a.toLowerCase().includes(q))
    || (p.author || '').toLowerCase().includes(q)
    || (p.topics || []).some(t => t.toLowerCase().includes(q))
  );
  renderPapers(matchAll);
});
</script>
</body>
</html>
