name = "readwise-vault-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Non-secret config. The PAT, Readwise tokens, and webhook secret are set
# via `wrangler secret put` and not committed.
[vars]
GITHUB_OWNER = "Coluding"
GITHUB_REPO  = "reading-vault"
GITHUB_BRANCH = "main"

# Optional observability — set true once deployed if you want logs in the dashboard
[observability]
enabled = true
